version: '2.4'

services:
  bot:
    build:
      context: .
      args:
        VERSION: 0fdf0e0
    container_name: mm_bot_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      SERVICE_DESK_URL: https://mobilebmc.tander.ru
      LOG_LEVEL: INFO
    volumes:
      - .:/app
      - ./logs:/app/logs
