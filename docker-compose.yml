version: '2.4'

services:
  bot:
    build:
      context: .
      args:
        VERSION: unknown
    container_name: mm_bot_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_TOKEN: 
      SERVICE_DESK_URL: https://mobilebmc.tander.ru
      LOG_LEVEL: INFO
    volumes:
      - ./logs:/app/logs
      - .:/app
